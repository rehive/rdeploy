version: '3'
configs:
  production:
    project_name: example
    docker_image: gcr.io/my-project/example:latest
    kube_context: gke_my-project_europe-west4_cluster-1
    cloud_provider:
      name: gcp
      project: my-project
      kube_cluster: cluster-1
      region: europe-west4
      helm_registry: europe-west4-docker.pkg.dev
    namespace: production
    helm_values_path: ./etc/helm/production/values.yaml
    helm_chart: rehive-service
    helm_chart_version: 0.2.0
    helm_version: 3.14.0
    use_system_helm: true
  staging:
    project_name: example
    docker_image: gcr.io/my-project/example:latest
    kube_context: gke_my-project_europe-west4_cluster-1
    cloud_provider:
      name: gcp
      project: my-project
      kube_cluster: cluster-1
      region: europe-west4
      helm_registry: europe-west4-docker.pkg.dev
    namespace: staging
    helm_values_path: ./etc/helm/staging/values.yaml
    helm_chart: rehive-service
    helm_chart_version: 0.2.0
    helm_version: 3.14.0
    use_system_helm: true
